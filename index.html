<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Status Tracker</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; padding: 20px; }
        #grouplist { max-width: 400px; margin-top: 20px; }
        .user-item { display: flex; align-items: center; margin-bottom: 15px; background: #1e1e1e; padding: 10px; border-radius: 8px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 15px; flex-shrink: 0; }
        #myInfo { margin-bottom: 20px; padding: 10px; border-bottom: 1px solid #333; color: #3ecf8e; }
        .buttons { margin-bottom: 20px; }
        button { padding: 8px 12px; margin-right: 5px; cursor: pointer; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="myInfo">Загрузка...</div>

    <div class="buttons">
        <button onclick="changeStatus('В сети', '#3ecf8e')" style="background: #3ecf8e; color: black;">В сети</button>
        <button onclick="changeStatus('Занят', '#ff453a')" style="background: #ff453a; color: white;">Занят</button>
    </div>

    <div id="grouplist"></div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const URL = 'https://gpecgmynkivsvdanrumy.supabase.co';
        const KEY = 'sb_publishable_o5ZSE1xhpVfgt8nY5R9lyg_lQbxI5RE'; // Убедитесь, что ключ полный
        const supabase = createClient(URL, KEY);

        const MY_ID = '4bc5694e-89f8-47d9-9b60-2d3bd2439122';

        window.changeStatus = async (text, color) => {
            const { error } = await supabase
                .from('profiles')
                .update({ status: text, color: color })
                .eq('id', MY_ID)

            if (error) {
                alert("Ошибка! Проверьте RLS политики в Supabase.");
                console.error(error);
            } else {
                fetchGroup();
            }
        };

        async function fetchGroup() {
            const { data, error } = await supabase
                .from('profiles')
                .select('*')
                .order('username', { ascending: true });

            if (error) return console.error(error);

            const list = document.getElementById('grouplist');
            list.innerHTML = data.map(user => `
                <div class="user-item">
                    <div class="status-dot" style="background: ${user.color || '#ccc'}"></div>
                    <div style="flex-grow: 1;">
                        <strong>${user.username}</strong><br>
                        <small style="color: #888;">${user.status || 'Статус не задан'}</small>
                    </div>
                </div>
            `).join('');

            const me = data.find(u => u.id === MY_ID);
            if (me) document.getElementById('myInfo').innerText = `Вы зашли как: ${me.username}`;
        }

        fetchGroup();

        setInterval(fetchGroup, 5000);
    </script>
</body>
</html>
